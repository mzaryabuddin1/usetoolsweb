  <defs>
    <style>
      .logo-navy { fill: #0a2558; }
      .logo-orange { fill: #f97316; }
      .logo-word {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
